<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>youyakun の設定</title>
<style>
  body { font: 14px/1.7 system-ui, "Noto Sans JP", sans-serif; max-width: 680px; margin: 32px auto; padding: 0 16px; color: #0f0f0f; }
  h1 { font-size: 20px; display: flex; align-items: center; gap: 10px; }
  h1::before { content: ""; width: 14px; height: 14px; border-radius: 50%; background: #127475; box-shadow: 10px 0 0 #f1eb35; margin-right: 12px; }
  h2 { font-size: 16px; margin-top: 32px; }
  label { display: block; font-weight: 600; margin-top: 14px; }
  .hint { color: #606060; font-size: 12px; font-weight: 400; }
  input, textarea { width: 100%; box-sizing: border-box; font: inherit; padding: 8px 10px; border: 1px solid #ccc; border-radius: 10px; margin-top: 4px; }
  textarea { min-height: 120px; }
  .row { display: flex; gap: 8px; margin-top: 16px; align-items: center; flex-wrap: wrap; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 999px; padding: 8px 18px; cursor: pointer; background: #f2f2f2; }
  button.primary { background: #127475; color: #fff; }
  button.danger { color: #c00; }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .tab { padding: 6px 14px; border-radius: 999px; background: #f2f2f2; cursor: pointer; font-weight: 500; border: 2px solid transparent; }
  .tab.sel { border-color: #127475; }
  .tab .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #ccc; margin-right: 6px; }
  .tab.active .dot { background: #127475; }
  .card { border: 1px solid #e5e5e5; border-radius: 20px; padding: 4px 18px 18px; margin-top: 12px; }
  .msg { font-size: 13px; white-space: pre-wrap; }
  .msg.err { color: #c00; }
  code { background: #f2f2f2; padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
  <h1>youyakun の設定</h1>

  <h2>接続先</h2>
  <div class="hint">Claude Code が動いているマシン（ブリッジ）を複数登録して切り替えられます。● が今使っている接続先です。YouTube のパネルからも切り替えられます。</div>
  <div class="tabs" id="tabs"></div>

  <div class="card" id="card">
    <label>名前
      <input id="name" placeholder="例: Pi（Tailscale）">
    </label>
    <label>ブリッジの URL
      <span class="hint">ブラウザと同じマシンなら <code>http://127.0.0.1:8765</code>。別のマシン（Mac から Pi など）なら、そのマシンの Tailscale の IP（例 <code>http://100.x.x.x:8765</code>）</span>
      <input id="url" placeholder="http://127.0.0.1:8765">
    </label>
    <label>トークン
      <span class="hint">ブリッジのマシンで <code>python3 ~/Documents/01_Project/youyakun/bridge/youyakun_bridge.py --print-token</code> を実行すると表示されます</span>
      <input id="token" type="password" autocomplete="off">
    </label>
    <label>モデル（空欄で Claude Code の既定）
      <span class="hint">例: <code>sonnet</code> / <code>opus</code> / <code>haiku</code></span>
      <input id="model">
    </label>
    <div class="row">
      <button class="primary" id="save">保存</button>
      <button id="test">接続を確かめる</button>
      <button id="use">この接続先を使う</button>
      <button class="danger" id="del">削除</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>

  <h2>要約の指示</h2>
  <label>「Claude で要約」で送る指示
    <span class="hint">字幕・タイトル・URL はこの後ろに自動で付きます。空欄で既定の指示に戻ります</span>
    <textarea id="promptTemplate"></textarea>
  </label>
  <div class="row">
    <button class="primary" id="savePrompt">保存</button>
    <span class="msg" id="msg2"></span>
  </div>
<script src="profiles.js"></script>
<script src="options.js"></script>
</body>
</html>
